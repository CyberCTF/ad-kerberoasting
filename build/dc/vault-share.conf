
# The flag lives here. Only svc-mssql-tms (and Domain Admins) may open the share, so the flag is
# reachable only once svc-mssql-tms's password has been recovered by kerberoasting.
[manifests]
   path = /srv/manifests
   read only = yes
   browseable = yes
   valid users = MERIDIAN\svc-mssql-tms, @"MERIDIAN\Domain Admins"
